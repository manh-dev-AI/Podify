<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podify — Listen · Learn · Grow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common/theme.css" />
  <link rel="stylesheet" href="css/listening/home.css" />
</head>
<body>
  <div class="podify-shell">
    <!-- ========== Shared Left Sidebar ========== -->
    <aside class="podify-sidebar">
      <div class="brand-box">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" />
          </svg>
        </div>
        <div class="brand-text">
          <strong>Podify</strong>
          <span>Listen · Learn · Grow</span>
        </div>
      </div>

      <nav class="nav-list" aria-label="Menu chính">
        <a href="#home" class="nav-item active" data-view="home">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>
          <span>Home</span>
        </a>
        <a href="#explore" class="nav-item" data-view="explore">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polygon points="15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5 15.5 8.5"/></svg>
          <span>Explore</span>
        </a>
        <a href="#library" class="nav-item" data-view="library">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
          <span>My Library</span>
        </a>
        <a href="#subscriptions" class="nav-item" data-view="subscriptions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
          <span>Subscriptions</span>
        </a>
        <a href="#history" class="nav-item" data-view="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>History</span>
        </a>
        <a href="#ratings" class="nav-item" data-view="ratings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.1 8.3 22 9.3 17 14.2 18.2 21 12 17.8 5.8 21 7 14.2 2 9.3 8.9 8.3 12 2"/></svg>
          <span>Ratings</span>
        </a>
      </nav>

      <div class="nav-divider"></div>
      <div class="nav-section-label">Creator &amp; Business</div>
      <nav class="nav-list">
        <a href="#analytics" class="nav-item" data-view="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 5-6"/></svg>
          <span>Ads &amp; Analytics</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <nav class="nav-list">
          <a href="#settings" class="nav-item" onclick="event.preventDefault(); PodifyUI.showToast('Trang Settings dùng chung');">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            <span>Settings</span>
          </a>
          <a href="#help" class="nav-item" onclick="event.preventDefault(); PodifyUI.showToast('Podify Database Project — Nhóm 3 thành viên');">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg>
            <span>Help &amp; Support</span>
          </a>
        </nav>

        <div class="theme-toggle-wrap">
          <span class="theme-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </span>
          <button id="themeSwitchBtn" class="theme-switch" aria-label="Đổi giao diện Sáng / Tối"></button>
        </div>
      </div>
    </aside>

    <!-- ========== Main Wrapper ========== -->
    <div class="podify-main-wrap">
      <header class="podify-topbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="search" placeholder="Search podcasts, channels..." />
        </div>

        <div class="topbar-actions">
          <button class="icon-btn" aria-label="Thông báo" onclick="PodifyUI.showToast('Bạn có 3 tập mới từ các kênh đã theo dõi')">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="notif-badge">3</span>
          </button>

          <button class="user-pill" onclick="PodifyUI.showToast('Đăng nhập với vai trò: User (QuanDang317)')">
            <span class="user-avatar">Q</span>
            <span class="user-name">QuanDang317</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </header>

      <main id="mainContent"></main>
    </div>
  </div>

  <!-- ========== Mini Audio Player Bar (Dùng thẻ <audio> HTML5 khi gắn MP3 thật) ========== -->
  <div id="miniPlayer" class="mini-player hidden">
    <div class="mp-left">
      <div id="mpThumb" class="mp-thumb">EP</div>
      <div class="mp-meta">
        <strong id="mpTitle">The Power of Small Habits</strong>
        <span id="mpChannel">TED Talks</span>
      </div>
    </div>

    <div class="mp-center">
      <div class="mp-controls">
        <button class="mp-skip" data-act="skip" data-delta="-15">-15s</button>
        <button id="mpPlayBtn" class="mp-play-btn" data-act="toggle-play" aria-label="Play/Pause"></button>
        <button class="mp-skip" data-act="skip" data-delta="30">+30s</button>
      </div>
      <div class="mp-progress-row">
        <span id="mpPos">00:00</span>
        <div class="progress-track"><div id="mpBar" class="progress-fill"></div></div>
        <span id="mpDur">18:20</span>
      </div>
    </div>

    <div class="mp-right">
      <button class="btn-secondary" style="padding:6px 12px;font-size:12px;" data-act="open-rate" data-id="100">★ Rate</button>
    </div>
  </div>

  <!-- ========== Rating Modal ========== -->
  <div id="rateModal" class="modal-backdrop" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <h3 id="rateModalTitle">Rate Episode</h3>
      <p id="rateModalSub" style="font-size:12.5px;color:var(--text-secondary);"></p>
      <div id="rateStars" class="star-row" style="margin-top:16px;font-size:26px;"></div>
      <textarea placeholder="Viết cảm nhận của bạn (tùy chọn)..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" data-act="close-rate">Hủy</button>
        <button class="btn-primary" data-act="submit-rate">Lưu đánh giá</button>
      </div>
    </div>
  </div>

  <div id="podifyToast" class="podify-toast"></div>

  <script src="js/common/layout.js"></script>
  <script src="js/listening/home.js"></script>
</body>
</html>
