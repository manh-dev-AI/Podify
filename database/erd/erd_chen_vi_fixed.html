  // Layering: attr lines -> rel lines -> attributes -> diamonds -> entities -> cardinality pills
  const attrLineLayer = el("g", { id: "attrLines" });
  const relLineLayer  = el("g", { id: "relLines" });
  const attrLayer     = el("g", { id: "attrs" });
  const diamondLayer  = el("g", { id: "diamonds" });
  const entityLayer   = el("g", { id: "entities" });
  const cardLayer     = el("g", { id: "cards" });

  // Themes
  const T = {
    m2: { fill: "#dbeafe", attrFill: "#eff6ff", stroke: "#2563eb", text: "#1e3a8a", line: "#3b82f6" },
    m1: { fill: "#fed7aa", attrFill: "#fff7ed", stroke: "#d97706", text: "#7c2d12", line: "#d97706" },

  // =========================================================================
  // DRAWING HELPERS
  // =========================================================================
  const entities = {};

  function addEntity(id, label, cx, cy, w, h, theme, attrs) {
    const th = T[theme];
    entities[id] = { cx, cy, w, h, l: cx - w/2, r: cx + w/2, t: cy - h/2, b: cy + h/2, theme };

    // Attributes & connecting lines (strictly connected to entity center, clipped behind entity rect)
    attrs.forEach(a => {
      el("line", {
        x1: cx, y1: cy, x2: a.x, y2: a.y,
        stroke: th.stroke, "stroke-width": 1.35, "stroke-opacity": 0.65
      }, attrLineLayer);

      const rx = a.rx || Math.max(54, a.label.length * 4.4 + 22);
      const ry = a.ry || 20;

      const ag = el("g", { filter: "url(#sh)" }, attrLayer);
      el("ellipse", {
        cx: a.x, cy: a.y, rx, ry,
        fill: th.attrFill, stroke: th.stroke, "stroke-width": a.pk ? 2 : 1.4
      }, ag);

      const at = el("text", {
        x: a.x, y: a.y + 4.5, "text-anchor": "middle",
        "font-size": 12.5, "font-weight": a.pk ? 800 : 600,
        fill: th.text,
        ...(a.pk ? { "text-decoration": "underline" } : {})
      }, ag);
      at.textContent = a.label;
    });

    // Entity rectangle
    const eg = el("g", { filter: "url(#sh)" }, entityLayer);
    el("rect", {
      x: cx - w/2, y: cy - h/2, width: w, height: h, rx: 8, ry: 8,
      fill: th.fill, stroke: th.stroke, "stroke-width": 2.4
    }, eg);

    const et = el("text", {
      x: cx, y: cy + 6, "text-anchor": "middle",
      "font-size": 16.5, "font-weight": 800, fill: th.text
    }, eg);
    et.textContent = label;
  }

  function addDiamond(cx, cy, label, theme, rx = 62, ry = 38) {
    const th = T[theme];
    const g = el("g", { filter: "url(#sh)" }, diamondLayer);
    const pts = `${cx},${cy - ry} ${cx + rx},${cy} ${cx},${cy + ry} ${cx - rx},${cy}`;
    el("polygon", {
      points: pts, fill: th.fill, stroke: th.stroke, "stroke-width": 2
    }, g);

    // Support 2-line diamond labels if needed
    const lines = label.split("\n");
    if (lines.length === 1) {
      el("text", {
        x: cx, y: cy + 5, "text-anchor": "middle",
        "font-size": 13.5, "font-weight": 700, fill: th.text
      }, g).textContent = label;
    } else {
      lines.forEach((ln, idx) => {
        el("text", {
          x: cx, y: cy + (idx === 0 ? -3 : 14), "text-anchor": "middle",
          "font-size": 12.5, "font-weight": 700, fill: th.text
        }, g).textContent = ln;
      });
    }
  }

  function addPoly(pts, color) {
    // Orthogonal polyline with smooth corners, NO arrows (strict Chen)
    let d = `M ${pts[0][0]} ${pts[0][1]}`;
    const rad = 8;
    for (let i = 1; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const len1 = Math.hypot(x1 - x0, y1 - y0) || 1;
      const len2 = Math.hypot(x2 - x1, y2 - y1) || 1;
      const r1 = Math.min(rad, len1 / 2), r2 = Math.min(rad, len2 / 2);
      const ax = x1 + ((x0 - x1) / len1) * r1, ay = y1 + ((y0 - y1) / len1) * r1;
      const bx = x1 + ((x2 - x1) / len2) * r2, by = y1 + ((y2 - y1) / len2) * r2;
      d += ` L ${ax} ${ay} Q ${x1} ${y1} ${bx} ${by}`;
    }
    const last = pts[pts.length - 1];
    d += ` L ${last[0]} ${last[1]}`;

    el("path", {
      d, fill: "none", stroke: color, "stroke-width": 2.1,
      "stroke-linejoin": "round", "stroke-linecap": "round"
    }, relLineLayer);
  }

  function addCard(x, y, text, color) {
    const w = text.length > 2 ? 44 : 28;
    const h = 23;
    el("rect", {
      x: x - w/2, y: y - h/2, width: w, height: h, rx: 5, ry: 5,
      fill: "#ffffff", stroke: color, "stroke-width": 1.6

    el("text", {
      x, y: y + 4.5, "text-anchor": "middle",
      "font-size": 12.5, "font-weight": 800, fill: color
    }, cardLayer).textContent = text;
  }
